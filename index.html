<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phasmophobia</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --sidebar-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #ff4444; 
            --include-color: #28a745;
            --exclude-color: #dc3545;
            --text-color: #f0f0f0;
            --border-color: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        #sidebar {
            width: 260px;
            background-color: var(--sidebar-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
            border-inline-end: 2px solid var(--border-color);
        }

        .nav-btn {
            background: #222;
            color: #aaa;
            border: 1px solid var(--border-color);
            padding: 14px;
            margin-bottom: 10px;
            cursor: pointer;
            border-radius: 8px;
            text-align: right;
            transition: 0.3s;
            font-weight: bold;
        }

        .nav-btn.active { background: var(--accent-color); color: white; }

        #main-view { flex-grow: 1; padding: 25px; overflow-y: auto; }
        .content-section { display: none; max-width: 1100px; margin: 0 auto; }
        .content-section.active { display: block; animation: fadeIn 0.3s ease; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .list-container { display: flex; gap: 20px; height: 85vh; }
        .side-column { width: 320px; overflow-y: auto; background: #111; padding: 15px; border-radius: 10px; border: 1px solid var(--border-color); }
        .details-column { flex-grow: 1; background: var(--card-bg); padding: 25px; border-radius: 10px; overflow-y: auto; border: 1px solid var(--border-color); }

        .search-box { width: 100%; padding: 12px; background: #000; border: 1px solid var(--border-color); color: white; border-radius: 8px; margin-bottom: 15px; box-sizing: border-box; font-size: 1rem; }
        .list-item { padding: 12px; margin-bottom: 6px; border-radius: 6px; cursor: pointer; background: #222; color: #ccc; transition: 0.2s; }
        .list-item.selected { background: #441111; border-inline-start: 4px solid var(--accent-color); color: white; }

        .tag { display: inline-block; background: #333; color: #ddd; padding: 4px 10px; border-radius: 15px; font-size: 0.8rem; margin: 3px; }
        .speed-tag { background: #113344; color: #88ccff; font-weight: bold; }
        .evidence-tag { background: #155724; color: #d4edda; }

        .evidence-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin-bottom: 20px; }
        .ev-btn { padding: 12px; background: #252525; border: 1px solid #444; border-radius: 6px; cursor: pointer; text-align: center; font-weight: bold; }
        .ev-btn.included { background: var(--include-color); }
        .ev-btn.excluded { background: var(--exclude-color); text-decoration: line-through; opacity: 0.5; }

        .tarot-card { background: #1a1a1a; border-radius: 10px; padding: 15px; text-align: center; border: 1px solid #333; }
        .tarot-card img { width: 90px; height: 140px; margin-bottom: 10px; border-radius: 4px; }
        
        .map-img { width: 100%; max-height: 400px; object-fit: contain; border-radius: 8px; margin-bottom: 20px; border: 1px solid #444; background: #000; }
        
        .info-list { list-style: none; padding: 0; }
        .info-list li { background: #2a2a2a; margin-bottom: 8px; padding: 12px; border-radius: 6px; border-inline-start: 4px solid var(--accent-color); line-height: 1.6; }
        
        .result-card { background:#1a1a1a; padding:20px; margin-top:15px; border-radius:10px; border-inline-start: 5px solid var(--accent-color); position: relative; }
    </style>
</head>

        let included = [], excluded = [];

        function showTab(id, btn) {
            document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            btn.classList.add('active');
            if(id === 'cards-tab') renderCards();
            if(id === 'maps-tab') renderMaps();
            if(id === 'ghosts-tab') renderGhostList();
        }

        document.querySelectorAll('.ev-btn').forEach(btn => {
            btn.onclick = () => {
                const val = btn.dataset.val;
                if (!btn.classList.contains('included') && !btn.classList.contains('excluded')) {
                    btn.classList.add('included'); included.push(val);
                } else if (btn.classList.contains('included')) {
                    btn.classList.remove('included'); btn.classList.add('excluded');
                    included = included.filter(i => i !== val); excluded.push(val);
                } else {
                    btn.classList.remove('excluded'); excluded = excluded.filter(i => i !== val);
                }
                updateEvidence();
            };
        });

        function updateEvidence() {
            const filtered = ghosts.filter(g => included.every(e => g.evidence.includes(e)) && !excluded.some(e => g.evidence.includes(e)));
            document.getElementById('evidence-results').innerHTML = filtered.map(g => `
                <div class="result-card">
                    <h3 style="margin:0 0 10px 0;">👻 ${g.name} <span class="tag speed-tag" style="float:left">${g.speed}</span></h3>
                    <div style="margin:10px 0;">${g.evidence.map(ev => `<span class="tag evidence-tag">${ev}</span>`).join('')}</div>
                    <ul class="info-list" style="margin-top:10px;">
                        ${g.info.map(i => `<li style="font-size:0.85rem; padding:8px;">${i}</li>`).join('')}
                    </ul>
                </div>
            `).join('');
        }

        function resetEvidence() {
            included = []; excluded = [];
            document.querySelectorAll('.ev-btn').forEach(b => b.classList.remove('included', 'excluded'));
            updateEvidence();
        }

        function renderGhostList(query = "") {
            const list = document.getElementById('ghost-list');
            const filtered = ghosts.filter(g => 
                g.name.toLowerCase().includes(query.toLowerCase()) || 
                g.info.some(i => i.toLowerCase().includes(query.toLowerCase())) ||
                g.speed.toLowerCase().includes(query.toLowerCase())
            );
            list.innerHTML = filtered.map(g => `<div class="list-item" onclick="viewGhost('${g.name}', this)">${g.name} <small style="float:left">${g.speed}</small></div>`).join('');
        }

        function viewGhost(name, el) {
            document.querySelectorAll('.list-item').forEach(li => li.classList.remove('selected'));
            el.classList.add('selected');
            const g = ghosts.find(x => x.name === name);
            document.getElementById('ghost-details').innerHTML = `
                <h1 style="color:var(--accent-color); margin-top:0;">👻 ${g.name}</h1>
                <div style="margin-bottom:20px;">
                    <span class="tag speed-tag" style="font-size:1rem;">السرعة: ${g.speed}</span>
                    ${g.evidence.map(e => `<span class="tag evidence-tag">${e}</span>`).join('')}
                </div>
                <h3>المعلومات والقدرات الفنية الكاملة:</h3>
                <ul class="info-list">${g.info.map(i => `<li>${i}</li>`).join('')}</ul>
            `;
        }

        function renderMaps() {
            const list = document.getElementById('maps-list');
            list.innerHTML = maps.map((m, i) => `<div class="list-item" onclick="viewMap(${i}, this)">${m.name}</div>`).join('');
        }

        function viewMap(i, el) {
            document.querySelectorAll('#maps-list .list-item').forEach(li => li.classList.remove('selected'));
            el.classList.add('selected');
            const m = maps[i];
            document.getElementById('map-details').innerHTML = `
                <h1>🗺️ ${m.name}</h1>
                <img src="maps/${m.file}" class="map-img" onerror="this.src='https://via.placeholder.com/600x350?text=${m.name}+Layout'">
                <div style="display:flex; gap:10px; margin-bottom:20px;">
                    <span class="tag">الحجم: ${m.size}</span>
                    <span class="tag">الغرف: ${m.rooms}</span>
                    <span class="tag">الطوابق: ${m.floors}</span>
                </div>
                <p style="background:#222; padding:15px; border-radius:8px;">${m.info}</p>
            `;
        }

        function renderCards() {
            document.getElementById('cards-container').innerHTML = tarotCards.map(c => `
                <div class="tarot-card">
                    <img src="cards/${c.file}" onerror="this.src='https://via.placeholder.com/90x140?text=${c.name}'">
                    <h3 style="color:var(--accent-color); margin:5px 0;">${c.name}</h3>
                    <p style="font-weight:bold; color:#fff; margin:5px 0;">${c.effect}</p>
                    <p style="font-size:0.8rem; color:#aaa; line-height:1.4;">${c.desc}</p>
                </div>
            `).join('');
        }

        renderGhostList();
        renderMaps();
    </script>
</body>
</html>
