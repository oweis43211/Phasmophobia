<!DOCTYPE html>
<html lang="ar" dir="rtl" id="main-html">

    <meta charset="UTF-8">

    <style>
        :root {
            --bg-color: #0a0a0a;
            --sidebar-color: #151515;
            --card-bg: #1e1e1e;
            --accent-color: #ff4444; 
            --exclude-color: #721c24;
            --include-color: #155724;
            --text-color: #ffffff;
            --secondary-text: #aaaaaa;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        #app-container { display: flex; flex-grow: 1; overflow: hidden; }

        #sidebar {
            width: 250px;
            background-color: var(--sidebar-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
            border-inline-end: 2px solid #222;
        }

        .nav-btn {
            background: #222;
            color: var(--secondary-text);
            border: 1px solid #333;
            padding: 15px;
            margin-bottom: 10px;
            cursor: pointer;
            border-radius: 8px;
            font-size: 1rem;
            transition: 0.3s;
            text-align: inherit;
        }

        .nav-btn.active { background: var(--accent-color); color: white; font-weight: bold; }

        #main-view { flex-grow: 1; padding: 30px; overflow-y: auto; }
        .content-section { display: none; width: 100%; max-width: 1000px; margin: 0 auto; }
        .content-section.active { display: block; animation: fadeIn 0.3s; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .evidence-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); 
            gap: 12px; 
            margin-bottom: 20px;
        }

        .evidence-btn {
            padding: 15px; background: #252525; border: 1px solid #444; border-radius: 8px;
            cursor: pointer; text-align: center; color: #fff; user-select: none;
        }

        .evidence-btn.included { background: var(--include-color); border-color: #28a745; }
        .evidence-btn.excluded { background: var(--exclude-color); border-color: #dc3545; text-decoration: line-through; opacity: 0.7; }

        .info-list { list-style: none; padding: 0; margin: 15px 0; }
        .info-list li {
            background: #2a2a2a; margin-bottom: 8px; padding: 12px; border-radius: 5px;
            border-inline-start: 3px solid var(--accent-color); line-height: 1.5;
        }

        .list-container { display: flex; gap: 20px; height: 75vh; }
        .side-column { width: 250px; overflow-y: auto; background: #151515; padding: 10px; border-radius: 10px; }
        .details-column { flex-grow: 1; background: var(--card-bg); padding: 30px; border-radius: 10px; border: 1px solid #333; overflow-y: auto;}

        .list-item { padding: 12px; margin-bottom: 5px; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        .list-item:hover { background: #222; }
        .list-item.selected { background: #331111; border-inline-start: 4px solid var(--accent-color); }

        .ghost-card { background: #252525; padding: 20px; margin-top: 15px; border-radius: 8px; border-bottom: 2px solid #444; }
        .tag { display: inline-block; background: #441111; color: #ff8888; padding: 5px 12px; border-radius: 15px; font-size: 0.8rem; margin-inline-end: 5px; margin-top: 10px; }
        .search-box { width: 100%; padding: 12px; background: #151515; border: 1px solid #333; color: white; border-radius: 8px; margin-bottom: 15px; }

        /* Map UI */
        .map-display {
            width: 100%;
            background: #111;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid #333;
            overflow: hidden;
        }

        .map-display img {
            width: 100%;
            display: block;
            height: auto;
            max-height: 500px;
            object-fit: contain;
        }

        #lang-selector {
            background: #111; padding: 10px; display: flex; justify-content: center; gap: 20px; border-top: 1px solid #333;
        }
        .lang-btn { color: var(--secondary-text); cursor: pointer; font-size: 0.9rem; text-decoration: none; }
        .lang-btn.active { color: white; font-weight: bold; border-bottom: 2px solid var(--accent-color); }
    </style>
</head>

                itemsAr: [
                    "جميع الأدوات: في المصلى (Chapel) عند المدخل الرئيسي",
                    "ملاحظة: تظهر الأدوات السبعة معاً في المصلى في هذه الخريطة"
                ],
                itemsEn: ["All Items: In the Chapel at the entrance"]
            },
            {
                name: "Point Hope",
                file: "maps/pointhope.png",
                itemsAr: [
                    "ويجا: الطابق 2 (غرفة الألعاب)",
                    "الكروت: الطابق 1 (منطقة الجلوس)",
                    "يد القرد: الطابق 3 (غرفة الاستراحة)",
                    "اداة الموسيقى: الطابق 4 (غرفة النوم)",
                    "المرآة: ممر السلالم",
                    "فودو: الطابق 2 (خلف الرفوف)",
                    "دائرة الاستدعاء: الطابق الأرضي (المدخل)"
                ],
                itemsEn: ["Ouija: Floor 2", "Tarot: Floor 1", "Monkey Paw: Floor 3", "Music Box: Floor 4", "Mirror: Stairwell", "Voodoo: Floor 2", "Summoning Circle: Ground floor"]
            },
            {
                name: "Brownstone High School",
                file: "maps/school.png",
                itemsAr: [
                    "ويجا: داخل أول فصل يمين",
                    "الكروت: في ممر المدخل الرئيسي",
                    "يد القرد: فوق خشبة المسرح",
                    "اداة الموسيقى: داخل المكتبة",
                    "المرآة: ممر السلالم",
                    "فودو: داخل صالة الرياضة",
                    "دائرة الاستدعاء: في منتصف الساحة"
                ],
                itemsEn: ["Ouija: Classroom", "Tarot: Main hall", "Monkey Paw: Stage", "Music Box: Library", "Mirror: Stairwell", "Voodoo: Gym", "Summoning Circle: Courtyard"]
            },
            {
                name: "Willow Street House",
                file: "maps/willow.png",
                itemsAr: [
                    "ويجا: داخل خزانة الممر",
                    "الكروت: غرفة المعيشة",
                    "يد القرد: الممر المؤدي للمرآب",
                    "اداة الموسيقى: المطبخ",
                    "المرآة: ممر القبو",
                    "فودو: المرآب",
                    "دائرة الاستدعاء: منتصف القبو"
                ],
                itemsEn: ["Ouija: Hallway closet", "Tarot: Living room", "Monkey Paw: Hallway", "Music Box: Kitchen", "Mirror: Basement hall", "Voodoo: Garage", "Summoning Circle: Basement"]
            }
        ];

        let currentLang = 'ar';
        let included = [];
        let excluded = [];

        function changeLang(lang) {
            currentLang = lang;
            const t = translations[lang];
            document.getElementById('main-html').dir = (lang === 'ar') ? 'rtl' : 'ltr';
            
            ["brand-name", "nav-ev", "nav-hunt", "nav-list", "nav-maps", "nav-reset", "ev-title", "hunt-title", "list-placeholder", "map-placeholder"].forEach(id => {
                if(document.getElementById(id)) document.getElementById(id).innerText = t[id.replace("-", "")] || t[id.split("-")[1]];
            });

            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('lang-' + lang).classList.add('active');
            
            updateEvidenceFilter();
            initGhostList();
            initMapsList();
        }

        function initGhostList() {
            const list = document.getElementById('ghost-names-list');
            list.innerHTML = '';
            ghosts.forEach(g => {
                const div = document.createElement('div');
                div.className = 'list-item';
                div.innerText = g.name;
                div.onclick = () => {
                    document.querySelectorAll('#ghost-names-list .list-item').forEach(i => i.classList.remove('selected'));
                    div.classList.add('selected');
                    const info = currentLang === 'ar' ? g.infoAr : g.infoEn;
                    document.getElementById('ghost-details-panel').innerHTML = `
                        <h1 style="color:var(--accent-color)">${g.name}</h1>
                        <ul class="info-list">${info.map(i => `<li>${i}</li>`).join('')}</ul>
                        <div style="margin-top:20px"><strong>${translations[currentLang].officialEv}</strong><br>
                        ${g.evidence.map(e => `<span class="tag">${e}</span>`).join('')}</div>
                    `;
                };
                list.appendChild(div);
            });
        }

        function initMapsList() {
            const list = document.getElementById('maps-list-column');
            list.innerHTML = '';
            mapsData.forEach(m => {
                const div = document.createElement('div');
                div.className = 'list-item';
                div.innerText = m.name;
                div.onclick = () => {
                    document.querySelectorAll('#maps-list-column .list-item').forEach(i => i.classList.remove('selected'));
                    div.classList.add('selected');
                    const items = currentLang === 'ar' ? m.itemsAr : m.itemsEn;
                    document.getElementById('map-details-panel').innerHTML = `
                        <h1 style="color:var(--accent-color)">${m.name}</h1>
                        <div class="map-display">
                            <img src="${m.file}" alt="${m.name}" onerror="this.parentElement.innerHTML='<p style=padding:20px;color:#666;text-align:center>الصورة غير موجودة في المجلد maps/${m.file.split('/')[1]}</p>'">
                        </div>
                        <h3>${translations[currentLang].cursedTitle}</h3>
                        <ul class="info-list">${items.map(i => `<li>${i}</li>`).join('')}</ul>
                    `;
                };
                list.appendChild(div);
            });
        }

        function showTab(id, btn) {
            document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            btn.classList.add('active');
        }

        // Evidence Logic
        document.querySelectorAll('.evidence-btn').forEach(btn => {
            btn.onclick = () => {
                const val = btn.getAttribute('data-val');
                if (!btn.classList.contains('included') && !btn.classList.contains('excluded')) {
                    btn.classList.add('included'); included.push(val);
                } else if (btn.classList.contains('included')) {
                    btn.classList.remove('included'); btn.classList.add('excluded');
                    included = included.filter(i => i !== val); excluded.push(val);
                } else {
                    btn.classList.remove('excluded'); excluded = excluded.filter(i => i !== val);
                }
                updateEvidenceFilter();
            };
        });

        function updateEvidenceFilter() {
            const filtered = ghosts.filter(g => included.every(e => g.evidence.includes(e)) && !excluded.some(e => g.evidence.includes(e)));
            document.getElementById('evidence-results').innerHTML = filtered.map(g => `
                <div class="ghost-card">
                    <h2 style="color:var(--accent-color)">${g.name}</h2>
                    ${g.evidence.map(e => `<span class="tag">${e}</span>`).join('')}
                </div>
            `).join('');
        }

        function resetEvidence() {
            included = []; excluded = [];
            document.querySelectorAll('.evidence-btn').forEach(b => b.classList.remove('included', 'excluded'));
            updateEvidenceFilter();
        }

        // Start
        initGhostList();
        initMapsList();
    </script>
</body>
</html>
